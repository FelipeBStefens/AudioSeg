<!DOCTYPE html>

<html lang="en">

    <head>
    
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../../style/register.css">

        <title>Sign Up</title>
    </head>
    
    <body>
        <div class="left_container">

            <h1 class="title">Sign Up</h1>

            <p class="subtitle">Welcome Back!</p>

            <form action="#" method="post">

                <input class="input_bars" type="email" placeholder="Email Address">

                <input class="input_bars" type="password" placeholder="Password">



                <button type="submit" class="bt">Register</button>

                <p>Already have an account yet? <a class="switch_pg" href="sign_in.html">Login</a></p>
            </form>
        </div>

        <div class="right_container">
            <img src="../../assets/Models/pin_local.png" alt="localization pin" class="pin">
            <img src="../../assets/Models/shooter.png" alt="shooter image" class="shooter">
        </div>
    </body>
</html>
