<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="stylesheet" href="../../style/register/sign_in.css">
        <script defer src="../../script/register.js"></script>

        <title>AudioSeg - Sign In</title>
    </head>
    
    <body>
        <div class="left_container">

            <h1 class="title">Sign In</h1>
            <p class="subtitle">Welcome Back!</p>

            <form action="../../server/register/sign_in_service.php" method="POST">

                <div class="input_group">
                    <span class="material-symbols-rounded field_icon" aria-hidden="true">mail</span>
                    <input class="input_bars" type="email" name="email" placeholder="Email Address" autocomplete="email" required>
                </div>

                <div class="input_group">
                    <span class="material-symbols-rounded field_icon" aria-hidden="true">lock</span>
                    <input class="input_bars" id="password" type="password" name="password" placeholder="Password" autocomplete="current-password" required>
                    
                    <button type="button" class="toggle_password" id="togglePassword" aria-label="Mostrar senha" aria-pressed="false">
                        <span class="material-symbols-rounded" id="passwordIcon" aria-hidden="true">visibility</span>
                    </button>
                </div>
                
                <div class="other_actions">
                    <div class="remember">
                        <input type="checkbox" id="remember" name="remember">
                        <label>Remember</label>
                    </div>

                    <a class="forgot" href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="submit">Enter</button>

                <p>Don't have an account yet? <a class="switch_page" href="sign_up.html">Register</a></p>
            </form>
        </div>

        <div class="right_container"> 
            <video id="video" autoplay muted playsinline>
                <source src="../../assets/videos/city.mp4" type="video/mp4">
            </video>
        </div>
    </body>
</html>
