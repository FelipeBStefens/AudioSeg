<!DOCTYPE html>

<html lang="en">

    <head>
    
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../../style/register.css">

        <title>Sign In</title>
    </head>
    
    <body>
        <div class="left_container">

            <h1 class="title">Sign In</h1>

            <p class="subtitle">Welcome Back!</p>

            <form action="#" method="post">

                <input class="input_bars" type="email" placeholder="Email Address">

                <input class="input_bars" type="password" placeholder="Password">

                <div class="other_actions">
                    <div class="remember">
                        <input type="checkbox">
                        <label>Remember</label>
                    </div>

                    <a class="forgot" href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="bt">Enter</button>

                <p>Don't have an account yet? <a class="switch_pg" href="sign_up.html">Register</a></p>
            </form>
        </div>

        <div class="right_container">
            <img src="../../assets/images/pin_local.png" alt="localization pin" class="pin">
            <img src="../../assets/images/shooter.png" alt="shooter image" class="shooter">
        </div>
    </body>
</html>
