<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="../../style/register/sign_up.css">
        <script defer src="../../script/register/sign_up.js"></script>

        <title>AudioSeg - Sign Up</title>
    </head>

    <body>

        <div class="left_container">
            <video id="video" autoplay muted playsinline>
                <source src="../../assets/videos/city.mp4" type="video/mp4">
            </video>
        </div>

        <div class="right_container register_left">

            <h1 class="title">Sign Up</h1>
            <p class="subtitle">Welcome Researcher!</p>
            
            <form action="../../server/register/sign_up_service.php" method="POST">

                <div class="form_progress">
                    <button type="button" class="progress_dot active" aria-label="Account" aria-current="step"></button>
                    <button type="button" class="progress_dot" aria-label="Personal Information" aria-current="false"></button>
                    <button type="button" class="progress_dot" aria-label="Address" aria-current="false"></button>
                    <button type="button" class="progress_dot" aria-label="Address Details" aria-current="false"></button>
                </div>

                <div class="form_box">

                    <div class="form_step">
                        <div class="input_group">
                            <span class="material-symbols-rounded field_icon" aria-hidden="true">person</span>
                            <input class="input_bars" type="text" id="username" name="username" placeholder="Username" autocomplete="username" required>
                        </div>

                        <div class="input_group">
                            <span class="material-symbols-rounded field_icon" aria-hidden="true">mail</span>
                            <input class="input_bars" type="email" id="email" name="email" placeholder="Email Address" autocomplete="email" required>
                        </div>

                        <div class="input_group">
                            <span class="material-symbols-rounded field_icon" aria-hidden="true">lock</span>
                            <input class="input_bars" type="password" id="password" name="password" placeholder="Password" autocomplete="new-password" required>

                            <button type="button" class="toggle_password" id="togglePassword" aria-label="Mostrar senha" aria-pressed="false">
                                <span class="material-symbols-rounded" id="passwordIcon" aria-hidden="true">visibility</span>
                            </button>
                        </div>
                    </div>
                    
                    <div class="form_step" hidden>
                        <div class="personal_info">
                            <label for="birth_date">Birth Date</label>
                            <input class="date_input" type="date" id="birth_date" name="birth_date" autocomplete="bday" required>
                        </div>

                        <div class="input_group">
                            <span class="material-symbols-rounded field_icon" aria-hidden="true">badge</span>
                            <input class="input_bars" type="text" id="cpf" name="cpf" placeholder="CPF" inputmode="numeric" autocomplete="off" maxlength="14" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" title="CPF" required>
                        </div>

                        <div class="input_group">
                            <span class="material-symbols-rounded field_icon" aria-hidden="true">phone</span>
                            <input class="input_bars" type="tel" id="phone" name="phone" placeholder="Phone Number" inputmode="numeric" autocomplete="tel" maxlength="18" pattern="\([0-9]{2}\) [0-9]{2} [0-9]{5}-[0-9]{4}" title="Phone Number" required>
                        </div>

                        <div class="input_group">
                            <span class="material-symbols-rounded field_icon" aria-hidden="true">school</span>
                            <input class="input_bars" type="text" id="institute" name="institute" placeholder="Institute" required>
                        </div>
                    </div>
                    
                    <div class="form_step" hidden>
                        <label class="label_desc">Address</label>

                        <div class="input_group">
                            <span class="material-symbols-rounded field_icon" aria-hidden="true">public</span>
                            <input class="input_bars" type="text" id="country" name="country" placeholder="Country" required>
                        </div>

                        <div class="input_group">
                            <span class="material-symbols-rounded field_icon" aria-hidden="true">map</span>
                            <input class="input_bars" type="text" id="state" name="state" placeholder="State" required>
                        </div>

                        <div class="input_group">
                            <span class="material-symbols-rounded field_icon" aria-hidden="true">location_city</span>
                            <input class="input_bars" type="text" id="city" name="city" placeholder="City" required>
                        </div>

                        <div class="input_group">
                            <span class="material-symbols-rounded field_icon" aria-hidden="true">home_work</span>
                            <input class="input_bars" type="text" id="neighborhood" name="neighborhood" placeholder="Neighborhood" required>
                        </div>
                    </div>
                    
                    <div class="form_step" hidden>
                        <div class="input_group">
                            <span class="material-symbols-rounded field_icon" aria-hidden="true">add_road</span>
                            <input class="input_bars" type="text" id="street" name="street" placeholder="Street" required>
                        </div>
                        
                        <div class="input_group">
                            <span class="material-symbols-rounded field_icon" aria-hidden="true">local_post_office</span>
                            <input class="input_bars" type="text" id="cep" name="cep" placeholder="CEP" inputmode="numeric" autocomplete="postal-code" maxlength="9" pattern="[0-9]{5}-[0-9]{3}" title="CEP" required>
                        </div>

                        <div class="input_group">
                            <span class="material-symbols-rounded field_icon" aria-hidden="true">tag</span>
                            <input class="input_bars" type="text" id="number" name="number_house" placeholder="Number" inputmode="numeric" maxlength="5" pattern="[0-9]{1,5}" title="Number" required>
                        </div>

                        <div class="input_group">
                            <span class="material-symbols-rounded field_icon" aria-hidden="true">corporate_fare</span>
                            <input class="input_bars" type="text" id="complement" name="additional_information" placeholder="Complement">
                        </div>
                    </div>
                </div>

                <button type="button" class="step_next">Next</button>
                <button type="submit" id="submit_button" class="submit" hidden>Register</button>

                <p>Already have an account? <a class="switch_page" href="./sign_in.html">Sign In</a></p>
            </form>
        </div>
    </body>
</html>
